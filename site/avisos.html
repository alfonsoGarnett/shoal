<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notifications · Shoal</title>
  <meta name="description" content="Push notifications for the tailnet and its modules, per device." data-i18n-content="notifications.description">
  <meta name="theme-color" content="#0a0c0b" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eceee8" media="(prefers-color-scheme: light)">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="vendor/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="vendor/fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/phosphor/style.css">
  <link rel="stylesheet" href="hub.css?v=__HUB_VERSION__">
  <script src="theme.js?v=__HUB_VERSION__"></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="bar">
    <a class="mark" href="./" aria-label="Back to index" data-i18n-aria="control.backIndex"><span>shoal</span><span class="slash">/</span><span data-scramble>hub</span></a>
    <div class="bar-meta">
    </div>
  </header>

  <main>
    <a class="back" href="./"><i class="ph ph-arrow-left" aria-hidden="true"></i><span data-i18n="common.index">Index</span></a>
    <section class="page-head">
      <h1 data-i18n="common.notifications">Notifications</h1>
      <p class="lede" id="lede" data-i18n="notifications.lede">Notifications on this device. Each device picks its own.</p>
      <div class="av-cta">
        <button class="btn btn-primary" type="button" id="enable"><i class="ph ph-bell-ringing" aria-hidden="true"></i><span data-i18n="notifications.enable">Enable here</span></button>
        <button class="btn btn-ghost" type="button" id="test" hidden><i class="ph ph-paper-plane-tilt" aria-hidden="true"></i><span data-i18n="notifications.test">Test</span></button>
        <button class="btn btn-ghost" type="button" id="disable" hidden><i class="ph ph-bell-slash" aria-hidden="true"></i><span data-i18n="notifications.disable">Disable here</span></button>
      </div>
      <p class="av-note" id="note"></p>
    </section>

    <section aria-labelledby="ev-h" style="padding-top:48px">
      <h2 id="ev-h" data-i18n="notifications.what">What to notify</h2>
      <ul class="toggles" id="toggles" data-fill></ul>
    </section>

    <section aria-labelledby="log-h" style="padding-top:64px">
      <h2 id="log-h" data-i18n="notifications.latest">Latest notifications</h2>
      <ol class="log" id="log" data-fill></ol>
    </section>
  </main>

  <footer class="foot"><span id="devices"></span><span data-i18n="notifications.footer">Web Push, end-to-end encrypted</span></footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="scramble.js?v=__HUB_VERSION__" defer></script>
  <script src="i18n.js?v=__HUB_VERSION__" defer></script>
  <script src="avisos.js?v=__HUB_VERSION__" defer></script>
  <script src="mascot.js?v=__HUB_VERSION__" defer></script>
  <script src="fleet.js?v=__HUB_VERSION__" defer></script>
  <script src="palette.js?v=__HUB_VERSION__" defer></script>
</body>
</html>
