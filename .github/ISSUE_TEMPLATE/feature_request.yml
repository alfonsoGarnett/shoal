name: Feature request
description: Suggest a focused improvement
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do? What is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: What else did you consider?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This keeps the core dependency-free.
        - label: This does not add a market for untrusted modules.
        - label: This does not put an LLM in the control loop.
